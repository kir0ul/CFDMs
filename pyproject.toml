[project]
name = "CFDMs"
version = "0.1"
requires-python = ">= 3.10"
dependencies = [
  "point-cloud-utils>=0.34.0,<0.35",
  "matplotlib>=3.11.2,<4",
  # "opencv-python>=5.0.0.93,<6"
]

[tool.pixi.workspace]
# channels = ["pytorch", "conda-forge"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
CFDMs = { path = ".", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
# include = ["pkg*"]  # alternatively: `exclude = ["additional*"]`
# namespaces = false

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.2.6,<3"
# faiss-cpu = "==1.15.1"
scikit-learn = ">=1.7.2,<2"
polyscope = ">=1.3.1,<2"
mkl = ">=2024.2.2,<2025"
ipdb = ">=0.13.13,<0.14"
ruff = ">=0.16.10,<0.17"
jupyterlab = ">=4.6.4,<5"
tqdm = ">=4.70.1,<5"
ipywidgets = ">=8.1.9,<9"
pandas = ">=3.0.6,<4"
rosbags = ">=0.11.5,<0.12"
opencv = ">=4.12.0,<5"
imageio = ">=2.38.0,<3"
h5py = ">=3.16.0,<4"
narwhals = "<=2.26.0"
