[project]
name = "CFDMs"
version = "0.1"
requires-python = ">= 3.10"
dependencies = ["point-cloud-utils>=0.34.0,<0.35", "matplotlib>=3.11.2,<4"]

[tool.pixi.workspace]
channels = ["pytorch", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
CFDMs = { path = ".", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
# include = ["pkg*"]  # alternatively: `exclude = ["additional*"]`
# namespaces = false

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.2.6,<3"
faiss-cpu = "==1.15.1"
scikit-learn = ">=1.7.2,<2"
polyscope = ">=1.3.1,<2"
mkl = ">=2024.2.2,<2025"
ipdb = ">=0.13.13,<0.14"
ruff = ">=0.16.10,<0.17"
jupyterlab = ">=4.6.4,<5"
